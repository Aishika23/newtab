      <button class="btn" id="settings" onclick="openPopup()"><span class="material-symbols-outlined" id="settings-icon">settings</span></button>
        
      
      <div id="popup">
    <div id="popup-content">
       
        <button class="btn" id="close" onclick="closePopup()" ><span class="material-symbols-outlined" id="close-icon">close</span></button>
    <h3 class="michroma-regular" id="edit">EDIT SHORTCUTS</h3>

    <hr>

    <span class="short-edit" ><h3>Shortcut 1:</h3><input class="edit-input" id="i0"></span>
    <span class="short-edit" ><h3>Shortcut 2:</h3><input class="edit-input" id="i1"></span>

    <span class="short-edit" ><h3>Shortcut 6:</h3><input class="edit-input" id="i5"></span>

    <hr>
    
    <button  id="save" onclick="update()">SAVE</button>
      </div>
</div>


        <div id="clock">
          <h1 id="current-time" class="michroma-regular">time</h1>
        </div>
        
            <div class="search_div" align="right">
              
              <input id="search_input" placeholder="Search">
              
              <button onclick="search()" class="btn" id="btn">
                <span class="material-symbols-outlined">search</span>
              </button>
</div><br>

              <button class="shortcut" id="s5" onclick="short(this)"></button>
             </div>
